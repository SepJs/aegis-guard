[package]
name        = "aegis-installer"
version     = "1.2.0"
edition     = "2021"
description = "Aegis-Guard cross-platform GTK3 GUI & headless CLI installer"

[[bin]]
name = "aegis-installer"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
gtk        = { version = "0.18", features = ["v3_24"] }
gdk-pixbuf = "0.18"
glib       = "0.18"
