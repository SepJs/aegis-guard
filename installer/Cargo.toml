[package]
name        = "aegis-installer"
version     = "1.2.0"
edition     = "2021"
description = "Aegis-Guard interactive cross-platform installer"

[[bin]]
name = "aegis-installer"
path = "src/main.rs"

[dependencies]
anyhow     = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
