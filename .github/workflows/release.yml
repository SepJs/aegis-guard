name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Run Tests & Web Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run security engine unit tests
        run: npx --yes tsx --test server-security.test.ts

      - name: Build console UI bundle
        run: npm run build

  build:
    name: Build (${{ matrix.platform }} / ${{ matrix.bundle }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            bundle: deb
          - os: ubuntu-22.04
            platform: linux
            bundle: rpm
          - os: ubuntu-22.04
            platform: linux
            bundle: appimage
          - os: ubuntu-22.04
            platform: linux
            bundle: arch
          - os: windows-latest
            platform: windows
            bundle: nsis
          - os: windows-latest
            platform: windows
            bundle: msi
          - os: macos-latest
            platform: macos
            bundle: dmg
          - os: macos-latest
            platform: macos
            bundle: app

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux native desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            build-essential

      - name: Install JS dependencies
        run: |
          npm install --no-audit --no-fund
          npm --prefix tauri-app install --no-audit --no-fund

      - name: Create release asset directory
        run: mkdir -p release-assets
        shell: bash

      - name: Build Go Network Observer (Linux)
        if: matrix.platform == 'linux'
        run: |
          cd network-observer
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../release-assets/aegis-network-observer-linux-amd64 ./cmd/observer

      - name: Build Rust Process Engine (Linux)
        if: matrix.platform == 'linux'
        run: |
          cargo build --release -p process-engine
          install -m 755 target/release/aegis-process-engine release-assets/aegis-process-engine-linux-amd64

      - name: Build Portable Console Archive (Linux)
        if: matrix.platform == 'linux'
        run: |
          npm run build
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VER="${TAG_NAME#v}"
          tar -czf "release-assets/aegis-guard-console_${VER}_portable.tar.gz" \
            dist server.ts server-security.ts package.json tauri-app/package.json \
            installers aegis.sh Makefile README.md INSTALLATION.md

      - name: Build Go Network Observer (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Push-Location network-observer
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="-s -w" -o ../release-assets/aegis-network-observer-windows-amd64.exe ./cmd/observer
          Pop-Location

      - name: Build Go Network Observer (macOS)
        if: matrix.platform == 'macos'
        run: |
          cd network-observer
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o ../release-assets/aegis-network-observer-darwin-arm64 ./cmd/observer
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o ../release-assets/aegis-network-observer-darwin-amd64 ./cmd/observer

      - name: Build Tauri Desktop Bundle
        if: matrix.platform != 'linux' || matrix.bundle != 'arch'
        run: npm --prefix tauri-app run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Build Arch portable bundle
        if: matrix.platform == 'linux' && matrix.bundle == 'arch'
        run: |
          mkdir -p release-assets
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VER="${TAG_NAME#v}"
          tar -czf "release-assets/aegis-guard-${VER}-arch-x86_64.tar.gz" \
            dist server.ts server-security.ts package.json tauri-app/package.json \
            installers aegis.sh Makefile README.md INSTALLATION.md

      - name: Collect Linux Bundles
        if: matrix.platform == 'linux'
        run: |
          find tauri-app/src-tauri/target -type f \
            \( -iname "*.deb" -o -iname "*.rpm" -o -iname "*.AppImage" -o -iname "*.tar.gz" -o -iname "*.tar.zst" -o -iname "*.pkg.tar.zst" \) \
            -exec cp -f {} release-assets/ \; 2>/dev/null || true
          ls -lh release-assets/

      - name: Collect Windows Bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path tauri-app/src-tauri/target -Recurse -File -Include *.exe,*.msi -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName -Destination release-assets/ -Force }
          if (-not (Get-ChildItem release-assets -File -Include *.exe,*.msi)) { throw 'No Windows installer bundles were produced.' }
          Get-ChildItem release-assets/

      - name: Collect macOS Bundles
        if: matrix.platform == 'macos'
        run: |
          find tauri-app/src-tauri/target -type f \
            \( -iname "*.dmg" -o -iname "*.app" \) \
            -exec cp -f {} release-assets/ \; 2>/dev/null || true
          ls -lh release-assets/

      - name: Validate artifact presence
        run: |
          test -n "$(ls -1 release-assets 2>/dev/null)"
          ls -lh release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.bundle }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Validate downloaded assets
        run: |
          find dist-artifacts -type f | sed 's#^#/#' | head -200
          test -n "$(find dist-artifacts -type f -print -quit)"

      - name: Generate SHA-256 Checksums
        run: |
          cd dist-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Resolve Release Tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create & Populate GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Aegis-Guard ${{ steps.meta.outputs.tag }} — Endpoint Security & Network IDS"
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist-artifacts/*
