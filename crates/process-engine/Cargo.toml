[package]
name        = "process-engine"
version     = "0.1.0"
edition     = "2021"
description = "Aegis-Guard — Linux process monitoring and anomaly detection engine"

[lib]
name = "process_engine"
path = "src/lib.rs"

[[bin]]
name = "aegis-process-engine"
path = "src/main.rs"

[dependencies]
serde              = { workspace = true }
serde_json         = { workspace = true }
tokio              = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
ipc                = { path = "../ipc" }

[target.'cfg(target_os = "linux")'.dependencies]
procfs             = "0.17"
