[package]
name        = "aegis-guard"
version     = "1.2.0"
edition     = "2021"
description = "Aegis-Guard desktop suite — Tauri shell + security engines"
authors     = ["Aegis-Guard Contributors"]
license     = "MIT OR Apache-2.0"

[lib]
name = "aegis_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Aegis-Guard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
blake3      = { workspace = true }

# Internal engines
active-defense = { path = "../../crates/active-defense" }
behavioral     = { path = "../../crates/behavioral" }
deception      = { path = "../../crates/deception" }
entropy        = { path = "../../crates/entropy" }
ipc            = { path = "../../crates/ipc" }
journal        = { path = "../../crates/journal" }
process-engine = { path = "../../crates/process-engine" }
self-protect   = { path = "../../crates/self-protect" }
threat-intel   = { path = "../../crates/threat-intel" }
updater        = { path = "../../crates/updater" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
